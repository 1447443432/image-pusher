name: Image Make
run-name: ${{ github.event_name == 'push' && 'Image Release (master)' || format('Image {0}', inputs.operation) }}

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      operation:
        description: Select the operation
        required: true
        default: push
        type: choice
        options:
          - push
          - release
          - push-and-release
      image:
        description: Source image for push mode, for example centos:7.9.2009
        required: false
        type: string
      target_image:
        description: Target image for push mode
        required: false
        type: string
      platforms:
        description: Architectures for push mode
        required: true
        default: amd64,arm64
        type: string
      publish:
        description: Push the image to the target registry
        required: true
        default: true
        type: boolean
      package:
        description: Create Docker archives in push mode
        required: true
        default: false
        type: boolean
      notify_hap:
        description: Notify HAP Webhook after completion
        required: true
        default: false
        type: boolean
      manifest_file:
        description: Existing image manifest for release mode
        required: true
        default: images.json
        type: string

jobs:
  image-make:
    name: Image Make
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release configuration
        id: release_name
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_IMAGE: ${{ inputs.image }}
          TARGET_IMAGE: ${{ inputs.target_image }}
          MANIFEST_FILE: ${{ inputs.manifest_file || 'images.json' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == push || "$OPERATION" == release ]]; then
            python3 - "$MANIFEST_FILE" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          value = data.get("release_name")
          if not value:
              raise SystemExit("manifest release_name is required")
          print(f"value={value}")
          PY
          else
            python3 - "$TARGET_IMAGE" >> "$GITHUB_OUTPUT" <<'PY'
          import re, sys
          ref = sys.argv[1].rsplit("/", 1)[-1]
          name, tag = ref.rsplit(":", 1) if ":" in ref else (ref, "latest")
          print(f"value={re.sub(r'[^A-Za-z0-9_.-]+', '_', f'{name}_{tag}')}")
          PY
          fi
      - name: Login to image registry
        if: ${{ (inputs.publish || github.event_name == 'push') && vars.REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Push image
        if: ${{ github.event_name != 'push' && (inputs.operation == 'push' || inputs.operation == 'push-and-release') }}
        env:
          SOURCE_IMAGE: ${{ inputs.image }}
          TARGET_IMAGE: ${{ inputs.target_image }}
          PLATFORMS: ${{ inputs.platforms }}
          PUBLISH: ${{ inputs.publish }}
          PACKAGE: ${{ inputs.operation == 'push-and-release' || inputs.package }}
          NOTIFY_HAP: ${{ inputs.notify_hap }}
          HAP_WEBHOOK_URL: ${{ secrets.HAP_WEBHOOK_URL }}
          HAP_WEBHOOK_APP_KEY: ${{ secrets.HAP_WEBHOOK_APP_KEY }}
          HAP_WEBHOOK_SIGN: ${{ secrets.HAP_WEBHOOK_SIGN }}
          RELEASE_TAG: ${{ steps.release_name.outputs.value }}
        run: bash scripts/push-images.sh
      - name: Create release-only archives
        if: ${{ inputs.operation == 'release' || github.event_name == 'push' }}
        env:
          CONFIG_FILE: ${{ inputs.manifest_file || 'images.json' }}
          NOTIFY_HAP: ${{ inputs.notify_hap || 'false' }}
          HAP_WEBHOOK_URL: ${{ secrets.HAP_WEBHOOK_URL }}
          HAP_WEBHOOK_APP_KEY: ${{ secrets.HAP_WEBHOOK_APP_KEY }}
          HAP_WEBHOOK_SIGN: ${{ secrets.HAP_WEBHOOK_SIGN }}
          RELEASE_TAG: ${{ steps.release_name.outputs.value }}
        run: bash scripts/create-release.sh
      - name: Create GitHub release
        if: ${{ inputs.operation == 'release' || inputs.operation == 'push-and-release' || inputs.package || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_name.outputs.value }}
          name: ${{ steps.release_name.outputs.value }}
          generate_release_notes: true
          files: release-assets/*
