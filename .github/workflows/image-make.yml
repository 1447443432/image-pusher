name: Image Make
run-name: ${{ github.event_name == 'push' && 'Image Release (master)' || format('Image Make - {0}', inputs.operation) }}

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      operation:
        description: Select the operation
        required: true
        default: push
        type: choice
        options:
          - push
          - release
          - push-and-release
      image:
        description: Source image for push mode
        required: false
        type: string
      target_image:
        description: Target image for push mode
        required: false
        type: string
      platforms:
        description: Architectures for push mode
        required: true
        default: amd64,arm64
        type: string
      publish:
        description: Push the image to the target registry
        required: true
        default: true
        type: boolean
      package:
        description: Create Docker archives in push mode
        required: true
        default: false
        type: boolean
      notify_hap:
        description: Notify HAP Webhook after completion
        required: true
        default: false
        type: boolean
      manifest_file:
        description: Existing image manifest for release mode
        required: true
        default: images.json
        type: string

env:
  REGISTRY: ${{ vars.REGISTRY }}
  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  HAP_WEBHOOK_URL: ${{ secrets.HAP_WEBHOOK_URL }}
  HAP_WEBHOOK_APP_KEY: ${{ secrets.HAP_WEBHOOK_APP_KEY }}
  HAP_WEBHOOK_SIGN: ${{ secrets.HAP_WEBHOOK_SIGN }}

jobs:
  resolve:
    name: Resolve release configuration
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - id: resolve
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_IMAGE: ${{ inputs.target_image }}
          MANIFEST_FILE: ${{ inputs.manifest_file || 'images.json' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == push || "$OPERATION" == release ]]; then
            python3 - "$MANIFEST_FILE" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          value = data.get("release_name")
          if not value:
              raise SystemExit("manifest release_name is required")
          print(f"value={value}")
          PY
          else
            python3 - "$TARGET_IMAGE" >> "$GITHUB_OUTPUT" <<'PY'
          import re, sys
          ref = sys.argv[1].rsplit("/", 1)[-1]
          name, tag = ref.rsplit(":", 1) if ":" in ref else (ref, "latest")
          name = re.sub(r"^linux_(?:amd64|arm64)_", "", name)
          print(f"value={re.sub(r'[^A-Za-z0-9_.-]+', '_', f'{name}_{tag}')}")
          PY
          fi

  push:
    name: Push image
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        if: ${{ github.event_name != 'push' && (inputs.operation == 'push' || inputs.operation == 'push-and-release') }}
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        if: ${{ github.event_name != 'push' && (inputs.operation == 'push' || inputs.operation == 'push-and-release') }}
        uses: docker/setup-buildx-action@v4
      - name: Login to image registry
        if: ${{ github.event_name != 'push' && (inputs.operation == 'push' || inputs.operation == 'push-and-release') && inputs.publish && env.REGISTRY != '' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Push image and create packages
        if: ${{ github.event_name != 'push' && (inputs.operation == 'push' || inputs.operation == 'push-and-release') }}
        env:
          SOURCE_IMAGE: ${{ inputs.image }}
          TARGET_IMAGE: ${{ inputs.target_image }}
          PLATFORMS: ${{ inputs.platforms }}
          PUBLISH: ${{ inputs.publish }}
          PACKAGE: ${{ inputs.operation == 'push-and-release' || inputs.package }}
          NOTIFY_HAP: ${{ inputs.notify_hap }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: bash scripts/push-images.sh
      - name: Create Release
        if: ${{ github.event_name != 'push' && (inputs.operation == 'push-and-release' || inputs.package) }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: ${{ needs.resolve.outputs.release_tag }}
          generate_release_notes: true
          files: release-assets/*
      - name: Push image summary
        env:
          PUSH_ENABLED: ${{ github.event_name != 'push' && (inputs.operation == 'push' || inputs.operation == 'push-and-release') }}
        run: |
          echo '# Push image' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PUSH_ENABLED" != true ]]; then
            echo 'Push image: skipped' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'Push image is only enabled for workflow_dispatch with operation push or push-and-release.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Push image: completed' >> "$GITHUB_STEP_SUMMARY"
          fi

  package:
    name: Build ${{ matrix.architecture }}
    if: ${{ inputs.operation == 'release' || github.event_name == 'push' }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Login to image registry
        if: ${{ env.REGISTRY != '' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Package ${{ matrix.architecture }} image
        env:
          CONFIG_FILE: ${{ inputs.manifest_file || 'images.json' }}
          ARCHITECTURE: ${{ matrix.architecture }}
          MANIFEST_FILE: release-assets/release-manifest-${{ matrix.architecture }}.json
          NOTIFY_HAP: false
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: bash scripts/create-release.sh
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.resolve.outputs.release_tag }}_${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create Release
    if: ${{ inputs.operation == 'release' || github.event_name == 'push' }}
    needs: [resolve, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.resolve.outputs.release_tag }}_*
          path: release-assets
          merge-multiple: true
      - name: Build release manifest
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          from datetime import datetime, timezone
          paths = glob.glob("release-assets/release-manifest-*.json")
          if not paths:
              raise SystemExit("no architecture manifests found")
          manifests = [json.load(open(path, encoding="utf-8")) for path in paths]
          images = [item for manifest in manifests for item in manifest["images"]]
          result = {
              "schema_version": 1,
              "release_name": manifests[0]["release_name"],
              "release_tag": os.environ["RELEASE_TAG"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "images": images,
              "summary": {"count": len(images), "architectures": sorted({item["architecture"] for item in images})}
          }
          json.dump(result, open("release-assets/release-manifest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          open("release-assets/release-manifest.json", "a", encoding="utf-8").write("\n")
          PY
      - name: Upload final release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.resolve.outputs.release_tag }}
          path: release-assets/*
          if-no-files-found: error
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: ${{ needs.resolve.outputs.release_tag }}
          generate_release_notes: true
          files: release-assets/*
      - name: Create Release summary
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          echo "# Release ${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: \`${GITHUB_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: [${RELEASE_TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '| Architecture | Image | Archive | SHA256 |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          GITHUB_SERVER_URL="$GITHUB_SERVER_URL" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" RELEASE_TAG="$RELEASE_TAG" python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          data = json.load(open("release-assets/release-manifest.json", encoding="utf-8"))
          base = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}"
          for item in data["images"]:
              archive = item["archive"]
              print(f"| {item['architecture']} | `{item['image']}` | [{archive}]({base}/{archive}) | `{item['sha256']}` |")
          PY
      - name: Sync Release to HAP
        env:
          NOTIFY_HAP: ${{ github.event_name == 'workflow_dispatch' && inputs.notify_hap || 'false' }}
        run: |
          echo '# HAP sync' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [[ "$NOTIFY_HAP" != true ]]; then
            echo 'HAP sync: skipped' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'notify_hap is disabled.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$HAP_WEBHOOK_URL" ]]; then
            echo 'HAP sync: skipped' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'HAP_WEBHOOK_URL is not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          headers=(-H 'Content-Type: application/json')
          [[ -z "$HAP_WEBHOOK_APP_KEY" ]] || headers+=(-H "AppKey: $HAP_WEBHOOK_APP_KEY")
          [[ -z "$HAP_WEBHOOK_SIGN" ]] || headers+=(-H "Sign: $HAP_WEBHOOK_SIGN")
          curl --fail-with-body --retry 2 -sS -X POST "$HAP_WEBHOOK_URL" "${headers[@]}" \
            --data-binary @release-assets/release-manifest.json
          echo 'HAP sync: notified successfully' >> "$GITHUB_STEP_SUMMARY"
