name: Image pusher

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select the operation
        required: true
        default: push
        type: choice
        options:
          - push
          - release
          - push-and-release
      image:
        description: Source image for push mode, for example centos:7.9.2009
        required: false
        type: string
      target_image:
        description: Target image for push mode
        required: false
        type: string
      platforms:
        description: Architectures for push mode
        required: true
        default: amd64,arm64
        type: string
      publish:
        description: Push the image to the target registry
        required: true
        default: true
        type: boolean
      package:
        description: Create Docker archives in push mode
        required: true
        default: false
        type: boolean
      notify_hap:
        description: Notify HAP Webhook after completion
        required: true
        default: false
        type: boolean
      manifest_file:
        description: Existing image manifest for release mode
        required: true
        default: images.json
        type: string

jobs:
  image-pusher:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to image registry
        if: ${{ inputs.publish && vars.REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Push image
        if: ${{ inputs.operation == 'push' || inputs.operation == 'push-and-release' }}
        env:
          SOURCE_IMAGE: ${{ inputs.image }}
          TARGET_IMAGE: ${{ inputs.target_image }}
          PLATFORMS: ${{ inputs.platforms }}
          PUBLISH: ${{ inputs.publish }}
          PACKAGE: ${{ inputs.operation == 'push-and-release' || inputs.package }}
          NOTIFY_HAP: ${{ inputs.notify_hap }}
          HAP_WEBHOOK_URL: ${{ secrets.HAP_WEBHOOK_URL }}
          HAP_WEBHOOK_APP_KEY: ${{ secrets.HAP_WEBHOOK_APP_KEY }}
          HAP_WEBHOOK_SIGN: ${{ secrets.HAP_WEBHOOK_SIGN }}
        run: bash scripts/push-images.sh
      - name: Create release-only archives
        if: ${{ inputs.operation == 'release' }}
        env:
          CONFIG_FILE: ${{ inputs.manifest_file }}
          NOTIFY_HAP: ${{ inputs.notify_hap }}
          HAP_WEBHOOK_URL: ${{ secrets.HAP_WEBHOOK_URL }}
          HAP_WEBHOOK_APP_KEY: ${{ secrets.HAP_WEBHOOK_APP_KEY }}
          HAP_WEBHOOK_SIGN: ${{ secrets.HAP_WEBHOOK_SIGN }}
        run: bash scripts/create-release.sh
      - name: Create GitHub release
        if: ${{ inputs.operation == 'release' || inputs.operation == 'push-and-release' || inputs.package }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: image-${{ github.run_number }}
          name: Image release ${{ github.run_number }}
          generate_release_notes: true
          files: release-assets/*
